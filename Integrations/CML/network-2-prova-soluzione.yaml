lab:
  title: TNES N2 prova - soluzione
  version: 0.3.0
  description: TNES - missione Network, massimo 5 nodi, rete isolata.
  notes: 'Interfacce modello 3D Gi0/x -> CML Ethernet0/x; switch Gi1/0/(x+1) -> Ethernet0/x. Console seriale
    esterna al conteggio nodi. Nessuna simulazione di fibra/SFP. Le password sono esempi didattici del
    copione, rete senza connettori esterni. RSA: generare le chiavi da console dopo il boot; vedere post-boot-ssh.txt.
    Un file startup non contiene la chiave privata.'
nodes:
- id: SW-PROVA
  label: SW-PROVA
  node_definition: ioll2-xe
  image_definition: ioll2-xe-17-18-02
  x: 0
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname SW-PROVA\nno ip domain lookup\nno ip routing\nspanning-tree mode pvst\ninterface\
      \ Ethernet0/0\n switchport mode access\n no shutdown\ninterface Ethernet0/1\n switchport mode access\n\
      \ no shutdown\ninterface Ethernet0/2\n switchport mode access\n no shutdown\ninterface Ethernet0/3\n\
      \ switchport mode access\n no shutdown\ninterface Vlan1\n ip address 192.168.1.2 255.255.255.0\n\
      \ no shutdown\nip default-gateway 192.168.1.1\nenable secret Privato1\nservice password-encryption\n\
      username admin secret Personale1\nip domain-name clara.local\nip ssh version 2\nbanner motd #Accesso\
      \ autorizzato#\nline con 0\n password Console1\n login\n logging synchronous\nline vty 0 15\n login\
      \ local\n transport input ssh\nend\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags:
  - tnes
- id: R1
  label: R1
  node_definition: iol-xe
  image_definition: iol-xe-17-18-02
  x: 0
  y: -180
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain lookup\nip routing\ninterface Ethernet0/0\n ip address 192.168.1.1\
      \ 255.255.255.0\n no shutdown\ninterface Ethernet0/1\n no ip address\n shutdown\ninterface Ethernet0/2\n\
      \ no ip address\n shutdown\ninterface Ethernet0/3\n no ip address\n shutdown\nline con 0\n logging\
      \ synchronous\nend\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags:
  - tnes
- id: PORTATILE
  label: PORTATILE
  node_definition: alpine
  image_definition: alpine-base-3-23-3
  x: -240
  y: 180
  configuration:
  - name: node.cfg
    content: 'hostname PORTATILE

      USERNAME=cisco

      PASSWORD=cisco

      ip link set eth0 up

      ip addr replace 192.168.1.10/24 dev eth0

      ip route replace default via 192.168.1.1

      '
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  tags:
  - tnes
links:
- id: l0
  n1: SW-PROVA
  i1: i1
  n2: PORTATILE
  i2: i0
  label: SW-PROVA - PORTATILE
  conditioning: {}
- id: l1
  n1: SW-PROVA
  i1: i2
  n2: R1
  i2: i1
  label: SW-PROVA - R1
  conditioning: {}
annotations: []
smart_annotations: []
