lab:
  title: TNES N2 Gaia - soluzione
  version: 0.3.0
  description: TNES - missione Network, massimo 5 nodi, rete isolata.
  notes: 'Interfacce modello 3D Gi0/x -> CML Ethernet0/x; switch Gi1/0/(x+1) -> Ethernet0/x. Console seriale
    esterna al conteggio nodi. Nessuna simulazione di fibra/SFP. Le password sono esempi didattici del
    copione, rete senza connettori esterni. Portatile solo console. Ping/SSH da PC2. Inizio: nessun cavo,
    switch da configurare, PC3 su subnet errata. Soluzione: SSH richiede chiavi post-boot.'
nodes:
- id: R1
  label: R1
  node_definition: iol-xe
  image_definition: iol-xe-17-18-02
  x: 0
  y: -180
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain lookup\nip routing\ninterface Ethernet0/0\n ip address 192.168.1.1\
      \ 255.255.255.0\n no shutdown\ninterface Ethernet0/1\n no ip address\n shutdown\ninterface Ethernet0/2\n\
      \ no ip address\n shutdown\ninterface Ethernet0/3\n no ip address\n shutdown\nline con 0\n logging\
      \ synchronous\nend\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags:
  - tnes
- id: SW-A
  label: SW-A
  node_definition: ioll2-xe
  image_definition: ioll2-xe-17-18-02
  x: -160
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname SW-A\nno ip domain lookup\nno ip routing\nspanning-tree mode pvst\ninterface Ethernet0/0\n\
      \ switchport mode access\n no shutdown\ninterface Ethernet0/1\n switchport mode access\n no shutdown\n\
      interface Ethernet0/2\n switchport mode access\n no shutdown\ninterface Ethernet0/3\n switchport\
      \ mode access\n no shutdown\ninterface Vlan1\n ip address 192.168.1.2 255.255.255.0\n no shutdown\n\
      ip default-gateway 192.168.1.1\nenable secret Privato1\nservice password-encryption\nusername admin\
      \ secret Personale1\nip domain-name clara.local\nip ssh version 2\nbanner motd #Accesso autorizzato#\n\
      line con 0\n password Console1\n login\n logging synchronous\nline vty 0 15\n login local\n transport\
      \ input ssh\nend\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags:
  - tnes
- id: SW-B
  label: SW-B
  node_definition: ioll2-xe
  image_definition: ioll2-xe-17-18-02
  x: 160
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname SW-B\nno ip domain lookup\nno ip routing\nspanning-tree mode pvst\ninterface Ethernet0/0\n\
      \ switchport mode access\n no shutdown\ninterface Ethernet0/1\n switchport mode access\n no shutdown\n\
      interface Ethernet0/2\n switchport mode access\n no shutdown\ninterface Ethernet0/3\n switchport\
      \ mode access\n no shutdown\ninterface Vlan1\n ip address 192.168.1.3 255.255.255.0\n no shutdown\n\
      ip default-gateway 192.168.1.1\nenable secret Privato1\nservice password-encryption\nusername admin\
      \ secret Personale1\nip domain-name clara.local\nip ssh version 2\nbanner motd #Accesso autorizzato#\n\
      line con 0\n password Console1\n login\n logging synchronous\nline vty 0 15\n login local\n transport\
      \ input ssh\nend\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags:
  - tnes
- id: PC2
  label: PC2
  node_definition: alpine
  image_definition: alpine-base-3-23-3
  x: -240
  y: 180
  configuration:
  - name: node.cfg
    content: 'hostname PC2

      USERNAME=cisco

      PASSWORD=cisco

      ip link set eth0 up

      ip addr replace 192.168.1.11/24 dev eth0

      ip route replace default via 192.168.1.1

      '
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  tags:
  - tnes
- id: PC3
  label: PC3
  node_definition: alpine
  image_definition: alpine-base-3-23-3
  x: 240
  y: 180
  configuration:
  - name: node.cfg
    content: 'hostname PC3

      USERNAME=cisco

      PASSWORD=cisco

      ip link set eth0 up

      ip addr replace 192.168.1.12/24 dev eth0

      ip route replace default via 192.168.1.1

      '
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  tags:
  - tnes
links:
