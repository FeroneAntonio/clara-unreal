    content: "hostname SW1\nno ip domain lookup\nno ip routing\nspanning-tree mode pvst\ninterface Ethernet0/0\n\
      \ switchport mode access\n no shutdown\ninterface Ethernet0/1\n switchport mode access\n no shutdown\n\
      interface Ethernet0/2\n switchport mode access\n no shutdown\ninterface Ethernet0/3\n switchport\
      \ mode access\n no shutdown\nline con 0\n logging synchronous\nend\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags:
  - tnes
